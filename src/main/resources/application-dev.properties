#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/dateca?createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

server.servlet.response-buffering-size=10240
server.tomcat.max-http-post-size=10485760
server.tomcat.max-http-form-post-size=20971520
# Um pouco acima do limite de 20MB validado na aplicacao, para que o arquivo chegue ao
# ImportJobApplicationService e o usuario receba a mensagem de erro de negocio em vez de um 413 do Tomcat.
spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=25MB

spring.datasource.hikari.minimum-idle=25
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connectionTimeout=10000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000

# jwt
api.security.token.secret=12345678

# swagger
springdoc.api-docs.enabled=true
springdoc.api-docs.yaml=true


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dateca.ufla@gmail.com
spring.mail.password=qcqukuefetsrdkli
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
