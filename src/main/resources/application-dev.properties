# importacao inteligente de provas - armazenamento de PDFs e imagens extraidas
dateca.storage.base-dir=./dateca-storage

# importacao inteligente de provas - selecao de provedor de extracao por visao (anthropic | ollama)
vision-extraction.provider=anthropic

# importacao inteligente de provas - IA (Anthropic, extracao estruturada com visao)
dateca.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
dateca.ai.anthropic.model=claude-sonnet-5
dateca.ai.anthropic.base-url=https://api.anthropic.com
dateca.ai.anthropic.version=2023-06-01
dateca.ai.anthropic.max-retries=2
# Escalona max_tokens quando a resposta vem truncada, ate este teto
dateca.ai.anthropic.max-tokens=4096
dateca.ai.anthropic.max-tokens-ceiling=16384

# importacao inteligente de provas - IA local (Ollama, usado quando vision-extraction.provider=ollama)
dateca.ai.ollama.base-url=http://localhost:11434
dateca.ai.ollama.model=qwen2.5:7b-instruct-q4_K_M
dateca.ai.ollama.max-tokens=4096
dateca.ai.ollama.max-tokens-ceiling=16384
# Timeout de leitura bem generoso: inferencia em CPU e lenta (~2 tokens/s sem GPU medido aqui),
# um bloco denso pode passar de 15 min (ISO-8601, ex.: PT30M = 30 minutos)
dateca.ai.ollama.read-timeout=PT30M
