# Perfil "local": roda a importacao de provas contra o Ollama local durante o desenvolvimento/MVP.
#
# Este perfil e um OVERLAY - ele so troca o provedor de extracao. As demais configuracoes (banco,
# jwt, mail, tamanho de upload) continuam vindo do perfil "dev", entao ative os dois juntos:
#
#   PowerShell:  $env:SPRING_PROFILES_ACTIVE = "dev,local"
#   Maven:       ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev,local"
#   IntelliJ:    Run > Edit Configurations > Active profiles: dev,local
#
# Pre-requisitos (fora do codigo):
#   1. Ollama instalado e no ar   -> curl http://localhost:11434  deve responder
#   2. Modelo baixado             -> ollama pull qwen2.5:7b-instruct-q4_K_M
#
# Blocos de TEXTO nativo vao para o Ollama local. Blocos com paginas ESCANEADAS (rasterizadas)
# continuam indo para a Anthropic - se voce for testar provas escaneadas, mantenha ANTHROPIC_API_KEY
# definida; para provas com texto nativo, a chave nao e usada.

vision-extraction.provider=ollama

dateca.ai.ollama.base-url=http://localhost:11434
dateca.ai.ollama.model=qwen2.5:7b-instruct-q4_K_M
